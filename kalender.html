<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal — BDG026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f0e8; --bg2:#ede8df; --surface:#faf7f2;
  --border:#ddd8ce; --border2:#c8c2b6;
  --ink:#1c1814; --ink2:#5a5248; --ink3:#9c9488; --ink4:#c4bdb4;
  --A:#1a3a2a;   --A-bg:#e8f2ec;  --A-mid:#b8d9c4;
  --B:#2a2060;   --B-bg:#eceaf8;  --B-mid:#bbb6e8;
  --C:#5a2000;   --C-bg:#f5ece6;  --C-mid:#e0b89a;
  --OFF:#6b2020; --OFF-bg:#faeaea; --OFF-mid:#e8b4b4;
  --HOL:#7a6000; --HOL-bg:#faf0d0; --HOL-mid:#e8d490;
  --sans:'Instrument Sans',sans-serif;
  --serif:'DM Serif Display',serif;
  --mono:'DM Mono',monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.032'/%3E%3C/svg%3E");}
.app{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:36px 28px 60px;}

/* Header */
.site-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1.5px solid var(--border2);}
.brand{font-family:var(--serif);font-size:2rem;color:var(--ink);letter-spacing:-.02em;line-height:1;margin-bottom:4px;}
.brand span{color:var(--ink3);font-style:italic;}
.brand-sub{font-size:.72rem;color:var(--ink3);font-weight:600;letter-spacing:.09em;text-transform:uppercase;}
.month-nav{display:flex;align-items:center;gap:12px;}
.mnav-btn{width:32px;height:32px;border:1.5px solid var(--border2);border-radius:50%;background:var(--surface);color:var(--ink2);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.mnav-btn:hover{background:var(--ink);color:var(--surface);border-color:var(--ink);}
.month-display{font-family:var(--serif);font-size:1.4rem;color:var(--ink);letter-spacing:-.01em;min-width:170px;text-align:center;}
.month-display small{font-family:var(--mono);font-size:.62rem;color:var(--ink3);display:block;letter-spacing:.06em;margin-top:1px;}

/* Status bar */
.status-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;padding:10px 16px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;font-size:.75rem;}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.status-dot.loading{background:#d97706;animation:pulse 1s infinite;}
.status-dot.ok{background:var(--A);}
.status-dot.error{background:var(--OFF);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-text{color:var(--ink2);font-weight:500;}
.status-sheet{font-family:var(--mono);font-size:.68rem;color:var(--ink3);}
.btn-refresh{margin-left:auto;padding:4px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-family:var(--sans);font-size:.7rem;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .13s;}
.btn-refresh:hover{background:var(--ink);color:var(--surface);border-color:var(--ink);}

/* Controls */
.controls-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.pill-group{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:99px;padding:3px;}
.pill{padding:5px 14px;border:none;border-radius:99px;font-family:var(--sans);font-size:.72rem;font-weight:600;cursor:pointer;transition:all .15s;background:transparent;color:var(--ink3);letter-spacing:.02em;}
.pill:hover{color:var(--ink);background:var(--surface);}
.pill.active-shift{background:var(--ink);color:var(--surface);}
.pill.active-task{background:#7a4010;color:#fff;}
.pill.active-omset{background:#1a4a2a;color:#fff;}

/* Legend */
.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;font-size:.72rem;color:var(--ink3);font-weight:500;}
.leg-sep{width:1px;height:14px;background:var(--border);}
.leg-item{display:flex;align-items:center;gap:6px;}
.leg-chip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;font-family:var(--mono);font-size:.65rem;font-weight:500;}
.leg-chip.A{background:var(--A-bg);color:var(--A);}
.leg-chip.B{background:var(--B-bg);color:var(--B);}
.leg-chip.C{background:var(--C-bg);color:var(--C);}
.leg-chip.OFF{background:var(--OFF-bg);color:var(--OFF);font-size:.5rem;}

/* Empty state */
.empty-state{text-align:center;padding:50px 24px;background:var(--surface);border:1.5px dashed var(--border);border-radius:14px;color:var(--ink3);}
.empty-icon{font-size:2.2rem;margin-bottom:12px;opacity:.5;}
.empty-title{font-family:var(--serif);font-size:1.05rem;color:var(--ink2);margin-bottom:6px;}
.empty-sub{font-size:.76rem;line-height:1.6;}

/* Table */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.schedule-table{width:100%;border-collapse:collapse;background:var(--surface);border:1.5px solid var(--border2);border-radius:14px;overflow:hidden;box-shadow:0 2px 20px rgba(28,24,20,.06),0 1px 4px rgba(28,24,20,.04);min-width:700px;}
.th-corner{background:var(--bg2);border-bottom:1.5px solid var(--border2);border-right:1.5px solid var(--border2);padding:10px 14px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);white-space:nowrap;min-width:140px;position:sticky;left:0;z-index:3;}
.th-date{background:var(--bg2);border-bottom:1.5px solid var(--border2);border-right:1px solid var(--border);padding:0;text-align:center;vertical-align:top;min-width:36px;width:36px;}
.th-date:last-child{border-right:none;}
.th-date-inner{padding:7px 3px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.th-dow{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);}
.th-num{font-family:var(--mono);font-size:.75rem;font-weight:500;color:var(--ink2);line-height:1;}
.th-date.weekend .th-dow,.th-date.weekend .th-num{color:var(--OFF);}
.th-date.holiday-col{background:var(--HOL-bg);}
.th-date.holiday-col .th-dow,.th-date.holiday-col .th-num{color:var(--HOL);}
.th-date.today-col{background:var(--ink);}
.th-date.today-col .th-dow,.th-date.today-col .th-num{color:#f5f0e8;}
.tr-person{border-bottom:1px solid var(--border);transition:background .1s;}
.tr-person:last-child{border-bottom:none;}
.tr-person:hover{background:rgba(28,24,20,.015);}
.td-name{background:var(--surface);border-right:1.5px solid var(--border2);padding:10px 14px;font-size:.77rem;font-weight:600;color:var(--ink);white-space:nowrap;position:sticky;left:0;z-index:2;box-shadow:2px 0 8px rgba(28,24,20,.05);}
.td-name-meta{display:block;font-size:.62rem;color:var(--ink3);font-weight:400;margin-top:1px;}
.td-shift{border-right:1px solid var(--border);padding:5px 3px;text-align:center;vertical-align:middle;}
.td-shift:last-child{border-right:none;}
.td-shift.today-col{background:rgba(28,24,20,.03);}
.td-shift.holiday-col{background:rgba(122,96,0,.04);}
.td-shift.weekend-col{background:rgba(107,32,32,.025);}
.shift-cell{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-family:var(--mono);font-size:.72rem;font-weight:500;}
.shift-cell.A{background:var(--A-bg);color:var(--A);}
.shift-cell.B{background:var(--B-bg);color:var(--B);}
.shift-cell.C{background:var(--C-bg);color:var(--C);}
.shift-cell.OFF{background:var(--OFF-bg);color:var(--OFF);font-size:.5rem;letter-spacing:-.02em;}
.shift-cell.empty{background:transparent;color:var(--ink4);font-size:.65rem;}

/* Skeleton cells */
.shift-cell.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--border) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:7px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Task row */
.tr-task{border-bottom:1px solid var(--border);background:rgba(122,64,16,.018);}
.td-task-label{background:#f5ede0;border-right:1.5px solid var(--border2);padding:8px 14px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#7a4010;position:sticky;left:0;z-index:2;box-shadow:2px 0 8px rgba(28,24,20,.05);}
.td-task{border-right:1px solid var(--border);padding:3px 2px;text-align:center;vertical-align:middle;}
.td-task:last-child{border-right:none;}
.task-dot{width:6px;height:6px;border-radius:50%;margin:0 auto;}
.task-dot.oneoff{background:#c07030;box-shadow:0 0 0 2px rgba(192,112,48,.2);}
.task-dot.perm{background:#2060a0;box-shadow:0 0 0 2px rgba(32,96,160,.2);}

/* Omset row */
.tr-omset{border-bottom:1px solid var(--border);background:rgba(26,74,42,.018);}
.td-omset-label{background:#eef5f0;border-right:1.5px solid var(--border2);padding:8px 14px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#1a4a2a;position:sticky;left:0;z-index:2;box-shadow:2px 0 8px rgba(28,24,20,.05);}
.td-omset{border-right:1px solid var(--border);padding:5px 3px;text-align:center;vertical-align:middle;font-family:var(--mono);font-size:.65rem;}
.td-omset:last-child{border-right:none;}
.td-omset.has-val{color:#1a4a2a;font-weight:500;}
.td-omset.no-val{color:var(--ink4);}

/* Summary */
.summary-strip{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.summary-card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px 18px;flex:1;min-width:180px;}
.summary-card-name{font-size:.72rem;font-weight:700;color:var(--ink2);margin-bottom:3px;}
.summary-card-role{font-size:.62rem;color:var(--ink3);margin-bottom:10px;}
.summary-counts{display:flex;gap:6px;flex-wrap:wrap;}
.summary-badge{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;font-size:.68rem;font-weight:600;}
.summary-badge.A{background:var(--A-bg);color:var(--A);}
.summary-badge.B{background:var(--B-bg);color:var(--B);}
.summary-badge.C{background:var(--C-bg);color:var(--C);}
.summary-badge.OFF{background:var(--OFF-bg);color:var(--OFF);}
.summary-badge span{font-family:var(--mono);font-size:.88em;}

/* Omset panel */
.omset-panel{margin-top:22px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:20px 24px;box-shadow:0 2px 20px rgba(28,24,20,.05);}
.omset-panel-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.omset-title{font-family:var(--serif);font-size:1.05rem;color:var(--ink);}
.omset-title small{font-family:var(--sans);font-size:.64rem;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:2px;}
.target-row{display:flex;align-items:center;gap:8px;}
.target-row label{font-size:.7rem;color:var(--ink3);font-weight:600;}
.target-input{width:90px;padding:6px 10px;border:1.5px solid var(--border2);border-radius:8px;font-family:var(--mono);font-size:.84rem;background:var(--bg2);color:var(--ink);text-align:center;}
.target-input:focus{outline:none;border-color:var(--ink);}
.btn-save-target{padding:6px 14px;background:var(--ink);color:var(--bg);border:none;border-radius:8px;font-family:var(--sans);font-size:.72rem;font-weight:700;cursor:pointer;}
.btn-save-target:hover{background:var(--A);}
.btn-save-target:disabled{opacity:.4;cursor:not-allowed;}
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:16px;}
.stat-item{padding:12px 14px;background:var(--bg2);border-radius:10px;}
.stat-lbl{font-size:.61rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:5px;}
.stat-val{font-family:var(--mono);font-size:1.3rem;font-weight:500;color:var(--ink);line-height:1;}
.stat-sub{font-size:.63rem;color:var(--ink3);margin-top:3px;}
.prog-wrap{margin-bottom:14px;}
.prog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.prog-lbl{font-size:.74rem;font-weight:600;color:var(--ink2);}
.prog-pct{font-family:var(--mono);font-size:.74rem;font-weight:500;}
.prog-pct.g{color:var(--A)}.prog-pct.w{color:var(--HOL)}.prog-pct.r{color:var(--OFF)}
.prog-track{height:5px;background:var(--bg2);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.4,0,.2,1);}
.prog-fill.g{background:var(--A)}.prog-fill.w{background:var(--HOL)}.prog-fill.r{background:var(--OFF)}
.prog-sub{font-size:.67rem;color:var(--ink3);margin-top:5px;}
.daily-box{background:var(--bg2);border-radius:10px;padding:12px 16px;}
.daily-lbl{font-size:.61rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:8px;}
.daily-body{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.omset-empty{text-align:center;padding:22px;color:var(--ink3);font-size:.82rem;}

/* Holidays */
.hol-strip{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.hol-strip-lbl{font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink4);margin-right:2px;}
.hol-chip{display:flex;align-items:center;gap:7px;padding:5px 10px;background:var(--HOL-bg);border:1px solid var(--HOL-mid);border-radius:7px;}
.hol-chip.custom{background:var(--OFF-bg);border-color:var(--OFF-mid);}
.hol-date{font-family:var(--mono);font-size:.63rem;color:var(--HOL);white-space:nowrap;}
.hol-chip.custom .hol-date{color:var(--OFF);}
.hol-name{font-size:.72rem;font-weight:600;color:var(--ink2);}

/* Modal */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(28,24,20,.4);backdrop-filter:blur(6px);z-index:500;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.open{display:flex;}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.modal-box{background:var(--surface);border:1.5px solid var(--border2);border-radius:18px;width:100%;max-width:420px;overflow:hidden;box-shadow:0 24px 60px rgba(28,24,20,.18);animation:slideUp .18s ease;}
.modal-head{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-family:var(--serif);font-size:1rem;color:var(--ink);}
.modal-close{width:26px;height:26px;border:1px solid var(--border);border-radius:50%;background:var(--bg2);color:var(--ink3);cursor:pointer;font-size:.78rem;display:flex;align-items:center;justify-content:center;transition:all .14s;}
.modal-close:hover{background:var(--ink);color:var(--surface);border-color:var(--ink);}
.modal-body{padding:18px 22px;}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.task-row{display:flex;align-items:center;padding:8px 10px;border-radius:8px;background:var(--bg2);margin-bottom:5px;font-size:.8rem;gap:8px;}
.task-badge{padding:2px 8px;border-radius:99px;font-size:.62rem;font-weight:700;white-space:nowrap;}
.btn{padding:8px 18px;border:none;border-radius:9px;font-family:var(--sans);font-weight:600;font-size:.8rem;cursor:pointer;transition:all .14s;}
.btn-ghost{background:var(--bg2);color:var(--ink2);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--border2);}

@media(max-width:640px){
  .app{padding:18px 12px 40px;}
  .brand{font-size:1.5rem;}
  .td-name{min-width:90px;padding:8px 10px;font-size:.7rem;}
  .th-corner{min-width:90px;}
  .month-display{font-size:1.1rem;min-width:130px;}
}
</style>
</head>
<body>
<div class="app">

  <header class="site-header">
    <div>
      <div class="brand">Jadwal <span>BDG026</span></div>
      <div class="brand-sub">Knit Core · Bandung</div>
    </div>
    <div class="month-nav">
      <button class="mnav-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-display">
        <span id="monthLabel">—</span>
        <small id="yearLabel">—</small>
      </div>
      <button class="mnav-btn" onclick="changeMonth(1)">›</button>
    </div>
  </header>

  <!-- Status bar -->
  <div class="status-bar" id="statusBar">
    <div class="status-dot loading" id="statusDot"></div>
    <span class="status-text" id="statusText">Memuat data shift…</span>
    <span class="status-sheet" id="statusSheet"></span>
    <button class="btn-refresh" onclick="loadAll()">↻ Refresh</button>
  </div>

  <!-- Controls -->
  <div class="controls-bar">
    <div class="pill-group">
      <button class="pill active-shift" id="pillShift" onclick="toggleLayer('shift')">Shift</button>
      <button class="pill active-task"  id="pillTask"  onclick="toggleLayer('task')">Tugas</button>
      <button class="pill active-omset" id="pillOmset" onclick="toggleLayer('omset')">Omset</button>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend" id="legShift">
    <span style="font-size:.61rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink4)">Shift</span>
    <div class="leg-item"><div class="leg-chip A">A</div>08.00–17.00</div>
    <div class="leg-item"><div class="leg-chip B">B</div>12.00–21.00</div>
    <div class="leg-item"><div class="leg-chip C">C</div>08.00–21.00</div>
    <div class="leg-item"><div class="leg-chip OFF">OFF</div>Libur</div>
  </div>

  <!-- Table -->
  <div id="tableWrap"></div>

  <!-- Summary -->
  <div class="summary-strip" id="summaryStrip" style="display:none;"></div>

  <!-- Omset Panel -->
  <div class="omset-panel" id="omsetPanel" style="display:none;">
    <div class="omset-panel-head">
      <div class="omset-title"><small>Monitoring</small>Omset <span id="omsetPanelMonth"></span></div>
      <div class="target-row">
        <label>Target</label>
        <input type="number" class="target-input" id="targetInput" placeholder="0" min="0">
        <button class="btn-save-target" id="btnTarget" onclick="saveTarget()">Simpan</button>
      </div>
    </div>
    <div id="omsetSkelWrap" style="display:none;">
      <div class="stat-row">
        <div style="height:70px;border-radius:10px;background:linear-gradient(90deg,var(--bg2) 25%,var(--border) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;"></div>
        <div style="height:70px;border-radius:10px;background:linear-gradient(90deg,var(--bg2) 25%,var(--border) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;"></div>
        <div style="height:70px;border-radius:10px;background:linear-gradient(90deg,var(--bg2) 25%,var(--border) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;"></div>
        <div style="height:70px;border-radius:10px;background:linear-gradient(90deg,var(--bg2) 25%,var(--border) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;"></div>
      </div>
    </div>
    <div id="omsetErr" class="omset-empty" style="display:none;"></div>
    <div id="omsetContent" style="display:none;">
      <div class="stat-row">
        <div class="stat-item"><div class="stat-lbl">Realisasi</div><div class="stat-val" id="statReal">—</div><div class="stat-sub">transaksi</div></div>
        <div class="stat-item"><div class="stat-lbl">Target</div><div class="stat-val" id="statTgt">—</div><div class="stat-sub">ditargetkan</div></div>
        <div class="stat-item"><div class="stat-lbl">Rata-rata</div><div class="stat-val" id="statAvg">—</div><div class="stat-sub" id="statAvgSub">per hari</div></div>
        <div class="stat-item"><div class="stat-lbl">Proyeksi</div><div class="stat-val" id="statProj">—</div><div class="stat-sub">akhir bulan</div></div>
      </div>
      <div class="prog-wrap">
        <div class="prog-head"><span class="prog-lbl">Progress Target</span><span class="prog-pct g" id="progPct">0%</span></div>
        <div class="prog-track"><div class="prog-fill g" id="progBar" style="width:0%"></div></div>
        <div class="prog-sub" id="progDetail"></div>
      </div>

        <div class="daily-lbl">Kebutuhan harian</div>
        <div class="daily-body" id="dailyNeedBody"></div>

  <div class="hol-strip" id="holStrip"></div>
</div>

<div class="modal-backdrop" id="taskModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="taskModalTitle">Tugas</h3>
      <button class="modal-close" onclick="closeModal('taskModal')">✕</button>

    </div>

<script>
// ══════════════════════════════════════════════
//  ⚙️  GANTI URL INI dengan URL Apps Script kamu
// ══════════════════════════════════════════════
const SHIFT_URL = 'https://script.google.com/macros/s/AKfycbyipwLF-Us-vYJE6c7sG0_lV8VBabgW3g3770v0yJbw0570U59V03d9Xw1-HcgpH6vc/exec';
const TASKS_URL = 'https://script.google.com/macros/s/AKfycbwZwB9wS0XkopObAh0uTzSK41ZIi4vRQRBCl_HlvQiP12ln96vxcKFd_qC_lGcXwzzE/exec';
const OMSET_URL = 'https://script.google.com/macros/s/AKfycbzXuFgBLpgbkIH9rsuuA40j5aFc07WU3Y4oHomrfhS_dBscCh034fcFUTN8fzVssXn9/exec';
// ══════════════════════════════════════════════

const today = new Date();
let currentMonth = today.getMonth(), currentYear = today.getFullYear();

// State
let employees = [];      // [{ name, role, shifts: { 1:'A', 2:'B', ... } }]
let taskData  = { oneoff:{} };
let customHolidays = {};
let omsetData = {};
let layers = { shift:true, task:true, omset:true };
let shiftLoaded = false;

const nationalHolidays = {
  '2025-01-01':'Tahun Baru 2025','2025-01-16':'Isra Mikraj','2025-01-29':'Imlek 2576',
  '2025-03-29':'Nyepi','2025-03-31':'Wafat Isa Al Masih','2025-04-01':'Cuti Bersama',
  '2025-04-02':'Cuti Idul Fitri','2025-04-03':'Idul Fitri 1446H','2025-04-04':'Idul Fitri 1446H',
  '2025-04-07':'Cuti Idul Fitri','2025-05-01':'Hari Buruh','2025-05-12':'Kenaikan Isa Al Masih',
  '2025-05-29':'Waisak 2569','2025-06-01':'Hari Pancasila','2025-06-06':'Idul Adha 1446H',
  '2025-06-27':'Tahun Baru Islam 1447H','2025-08-17':'HUT RI ke-80','2025-09-05':'Maulid Nabi',
  '2025-12-25':'Natal','2025-12-26':'Cuti Bersama Natal',
  '2026-01-01':'Tahun Baru 2026','2026-01-06':'Isra Mikraj','2026-02-17':'Imlek 2577',
  '2026-03-19':'Nyepi','2026-03-20':'Idul Fitri 1447H','2026-03-21':'Idul Fitri 1447H',
  '2026-04-03':'Wafat Isa Al Masih','2026-05-01':'Hari Buruh','2026-05-14':'Kenaikan Isa Al Masih',
  '2026-05-18':'Waisak 2570','2026-05-27':'Idul Adha 1447H','2026-06-01':'Hari Pancasila',
  '2026-06-17':'Tahun Baru Islam 1448H','2026-08-17':'HUT RI ke-81','2026-08-26':'Maulid Nabi',
  '2026-12-25':'Natal'
};
const PERMANENT_TASKS = [
  {name:'Perawatan PC',type:'weekly',days:[6]},
  {name:'Perawatan PC',type:'monthly-odd',dates:[15]},
  {name:'Ganti Air Uji',type:'monthly',dates:[1,16]}
];
const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DN=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];

function dk(y,m,d){return`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function isWork(y,m,d){const dow=new Date(Date.UTC(y,m,d)).getUTCDay();return dow!==0&&!nationalHolidays[dk(y,m+1,d)]&&!customHolidays[dk(y,m+1,d)];}
function getHolName(y,m,d){return nationalHolidays[dk(y,m+1,d)]||customHolidays[dk(y,m+1,d)]||null;}
function getTasksForDay(y,m,d){
  const key=dk(y,m+1,d),dow=new Date(Date.UTC(y,m,d)).getUTCDay();
  const perm=PERMANENT_TASKS.filter(t=>{
    if(t.type==='weekly')return t.days.includes(dow);
    if(t.type==='monthly')return t.dates.includes(d);
    if(t.type==='monthly-odd')return t.dates.includes(d)&&(m%2===0);
    return false;
  }).map(t=>({name:t.name,kind:'perm'}));
  return[...perm,...(taskData.oneoff[key]||[]).map(t=>({...t,kind:t.type||'tugas'}))];
}

function setStatus(state, text, sheet=''){
  const dot=document.getElementById('statusDot'),txt=document.getElementById('statusText'),sh=document.getElementById('statusSheet');
  dot.className='status-dot '+state; txt.textContent=text;
  sh.textContent=sheet?`· sheet: ${sheet}`:'';
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-backdrop').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-backdrop.open').forEach(m=>m.classList.remove('open'));});

function toast(msg,type='success'){
  document.getElementById('_t')?.remove();
  const el=document.createElement('div');el.id='_t';
  const bg={success:'#1a3a2a',error:'#6b2020',info:'#2a2060',warning:'#7a6000'}[type]||'#1a3a2a';
  el.style.cssText=`position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:${bg};color:#f5f0e8;padding:10px 22px;border-radius:9px;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:.82em;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:9999;white-space:nowrap;pointer-events:none;`;
  el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2400);
}

// ── Load shift from Apps Script ──
async function loadShift(){
  setStatus('loading','Memuat data shift…');
  renderSkeletonTable();
  try{
    const res=await fetch(`${SHIFT_URL}?action=shift&year=${currentYear}&month=${currentMonth+1}`);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json=await res.json();
    if(json.error) throw new Error(json.error);
    if(!json.found) throw new Error('Sheet tidak ditemukan');
    employees=json.employees||[];
    shiftLoaded=true;
    setStatus('ok',`${employees.length} karyawan · ${MN[currentMonth]} ${currentYear}`,json.sheetName);
  }catch(e){
    shiftLoaded=false; employees=[];
    setStatus('error','Gagal memuat shift: '+e.message);
    toast('Gagal memuat shift','error');
  }
}

// ── Load tasks ──
async function loadTasks(){
  try{
    const res=await fetch(TASKS_URL+'?action=tasks');
    if(!res.ok) throw new Error();
    const rows=await res.json();
    taskData={oneoff:{}}; customHolidays={};
    rows.forEach(row=>{
      if(!row.date)return;
      let key=row.date;
      if(key.includes('T')){const d=new Date(key);key=dk(d.getFullYear(),d.getMonth()+1,d.getDate());}
      if(row.type==='__holiday__') customHolidays[key]=row.name||'Libur Tambahan';
      else{if(!taskData.oneoff[key])taskData.oneoff[key]=[];taskData.oneoff[key].push({id:row.id,name:row.name,type:row.type||'tugas'});}
    });
  }catch(e){taskData={oneoff:{}};customHolidays={};}
}

async function loadAll(){
  omsetData={};
  document.getElementById('targetInput').value='';
  await Promise.all([loadShift(), loadTasks()]);
  renderTable();
  if(layers.omset){document.getElementById('omsetPanelMonth').textContent=MN[currentMonth];loadOmsetData();}
}

function changeMonth(dir){
  currentMonth+=dir;
  if(currentMonth>11){currentMonth=0;currentYear++;}
  else if(currentMonth<0){currentMonth=11;currentYear--;}
  document.getElementById('monthLabel').textContent=MN[currentMonth];
  document.getElementById('yearLabel').textContent=currentYear;
  loadAll();
}

function toggleLayer(l){
  layers[l]=!layers[l]; updateLayerUI(); renderTable();
  if(layers.omset){document.getElementById('omsetPanelMonth').textContent=MN[currentMonth];loadOmsetData();}
}
function updateLayerUI(){
  document.getElementById('pillShift').className='pill'+(layers.shift?' active-shift':'');
  document.getElementById('pillTask').className='pill'+(layers.task?' active-task':'');
  document.getElementById('pillOmset').className='pill'+(layers.omset?' active-omset':'');
  document.getElementById('legShift').style.display=layers.shift?'flex':'none';
  document.getElementById('omsetPanel').style.display=(layers.omset&&shiftLoaded)?'block':'none';
  document.getElementById('summaryStrip').style.display=(layers.shift&&shiftLoaded)?'flex':'none';
}

// ── Skeleton table while loading ──
function renderSkeletonTable(){
  const dim=new Date(currentYear,currentMonth+1,0).getDate();
  const table=document.createElement('table'); table.className='schedule-table';
  const thead=document.createElement('thead'); const tr=document.createElement('tr');
  const corner=document.createElement('th'); corner.className='th-corner'; corner.textContent='Karyawan'; tr.appendChild(corner);
  for(let d=1;d<=dim;d++){
    const dow=new Date(Date.UTC(currentYear,currentMonth,d)).getUTCDay();
    const th=document.createElement('th'); th.className='th-date'+(dow===0||dow===6?' weekend':'');
    th.innerHTML=`<div class="th-date-inner"><span class="th-dow">${DN[dow]}</span><span class="th-num">${d}</span></div>`;
    tr.appendChild(th);
  }
  thead.appendChild(tr); table.appendChild(thead);
  const tbody=document.createElement('tbody');
  for(let r=0;r<4;r++){
    const row=document.createElement('tr'); row.className='tr-person';
    const td=document.createElement('td'); td.className='td-name';
    td.innerHTML='<div style="width:100px;height:12px;border-radius:4px;background:linear-gradient(90deg,var(--bg2) 25%,var(--border) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;"></div>';
    row.appendChild(td);
    for(let d=1;d<=dim;d++){
      const td2=document.createElement('td'); td2.className='td-shift';
      const cell=document.createElement('div'); cell.className='shift-cell skel'; td2.appendChild(cell); row.appendChild(td2);
    }
    tbody.appendChild(row);
  }
  table.appendChild(tbody);
  const wrap=document.createElement('div'); wrap.className='table-scroll'; wrap.appendChild(table);
  document.getElementById('tableWrap').innerHTML=''; document.getElementById('tableWrap').appendChild(wrap);
}

// ── Main render ──
function renderTable(){
  document.getElementById('monthLabel').textContent=MN[currentMonth];
  document.getElementById('yearLabel').textContent=currentYear;
  updateLayerUI();

  if(!shiftLoaded){
    document.getElementById('tableWrap').innerHTML=`<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-title">Data shift tidak tersedia</div><div class="empty-sub">Pastikan URL Apps Script sudah diisi dan sheet sudah ada.<br>Klik <strong>↻ Refresh</strong> untuk coba lagi.</div></div>`;
    document.getElementById('summaryStrip').style.display='none';
    return;
  }

  const dim=new Date(currentYear,currentMonth+1,0).getDate();
  const cols=[];
  for(let d=1;d<=dim;d++){
    const dow=new Date(Date.UTC(currentYear,currentMonth,d)).getUTCDay();
    cols.push({
      d,dow,
      isWknd:dow===0||dow===6,
      isHol:!!(nationalHolidays[dk(currentYear,currentMonth+1,d)]||customHolidays[dk(currentYear,currentMonth+1,d)]),
      isToday:d===today.getDate()&&currentMonth===today.getMonth()&&currentYear===today.getFullYear()
    });
  }

  const table=document.createElement('table'); table.className='schedule-table';

  // THEAD
  const thead=document.createElement('thead'); const theadRow=document.createElement('tr');
  const corner=document.createElement('th'); corner.className='th-corner'; corner.textContent='Karyawan'; theadRow.appendChild(corner);
  cols.forEach(c=>{
    const th=document.createElement('th');
    th.className='th-date'+(c.isWknd?' weekend':'')+(c.isHol?' holiday-col':'')+(c.isToday?' today-col':'');
    th.title=c.isHol?getHolName(currentYear,currentMonth,c.d)||'':'';
    th.innerHTML=`<div class="th-date-inner"><span class="th-dow">${DN[c.dow]}</span><span class="th-num">${c.d}</span></div>`;
    theadRow.appendChild(th);
  });
  thead.appendChild(theadRow); table.appendChild(thead);

  const tbody=document.createElement('tbody');

  // Shift rows
  if(layers.shift){
    employees.forEach(emp=>{
      const tr=document.createElement('tr'); tr.className='tr-person';
      const tdName=document.createElement('td'); tdName.className='td-name';
      tdName.innerHTML=`${emp.name}<span class="td-name-meta">${emp.role||'—'}</span>`;
      tr.appendChild(tdName);
      cols.forEach(c=>{
        const shift=(emp.shifts||{})[c.d]||'';
        const td=document.createElement('td');
        td.className='td-shift'+(c.isToday?' today-col':'')+(c.isHol?' holiday-col':'')+(c.isWknd?' weekend-col':'');
        const cell=document.createElement('div'); cell.className='shift-cell '+(shift||'empty');
        cell.textContent=shift||'·'; td.appendChild(cell); tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  // Task row
  if(layers.task){
    const tr=document.createElement('tr'); tr.className='tr-task';
    const lbl=document.createElement('td'); lbl.className='td-task-label'; lbl.textContent='Tugas'; tr.appendChild(lbl);
    cols.forEach(c=>{
      const tasks=getTasksForDay(currentYear,currentMonth,c.d);
      const td=document.createElement('td'); td.className='td-task';
      if(tasks.length){
        const wrap=document.createElement('div');
        wrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px;';
        tasks.slice(0,3).forEach(t=>{
          const dot=document.createElement('div');
          dot.className='task-dot '+(t.kind==='perm'?'perm':'oneoff');
          dot.title=t.name; wrap.appendChild(dot);
        });
        td.appendChild(wrap); td.style.cursor='pointer';
        td.onclick=()=>openTaskDetail(c.d);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }

  // Omset row
  if(layers.omset){
    const tr=document.createElement('tr'); tr.className='tr-omset';
    const lbl=document.createElement('td'); lbl.className='td-omset-label'; lbl.textContent='Omset'; tr.appendChild(lbl);
    cols.forEach(c=>{
      const key=dk(currentYear,currentMonth+1,c.d);
      const td=document.createElement('td'); td.className='td-omset';
      const d=omsetData[key];
      if(d&&d.total>0){td.textContent=d.total;td.classList.add('has-val');}
      else if(isWork(currentYear,currentMonth,c.d)){td.textContent='—';td.classList.add('no-val');}
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }

  table.appendChild(tbody);
  const wrap=document.createElement('div'); wrap.className='table-scroll'; wrap.appendChild(table);
  document.getElementById('tableWrap').innerHTML=''; document.getElementById('tableWrap').appendChild(wrap);
  renderSummary(); renderHolidays();
}

function openTaskDetail(day){
  const tasks=getTasksForDay(currentYear,currentMonth,day);
  document.getElementById('taskModalTitle').textContent=`${day} ${MN[currentMonth]} ${currentYear}`;
  const body=document.getElementById('taskModalBody'); body.innerHTML='';
  if(!tasks.length){body.innerHTML='<div style="font-size:.78rem;color:var(--ink3);font-style:italic;">Tidak ada tugas hari ini.</div>';}
  else tasks.forEach(t=>{
    const row=document.createElement('div'); row.className='task-row';
    const badge=t.kind==='perm'
      ?`<span class="task-badge" style="background:rgba(32,96,160,.12);color:#2060a0;">Tetap</span>`
      :`<span class="task-badge" style="background:rgba(122,64,16,.1);color:#7a4010;">${t.type||'Tugas'}</span>`;
    row.innerHTML=`<span style="flex:1">${t.name}</span>${badge}`;
    body.appendChild(row);
  });
  openModal('taskModal');
}

function renderSummary(){
  const strip=document.getElementById('summaryStrip');
  if(!layers.shift||!shiftLoaded){strip.style.display='none';return;}
  strip.style.display='flex'; strip.innerHTML='';
  const dim=new Date(currentYear,currentMonth+1,0).getDate();
  employees.forEach(emp=>{
    const counts={A:0,B:0,C:0,OFF:0};
    for(let d=1;d<=dim;d++){const s=(emp.shifts||{})[d];if(s&&counts[s]!==undefined)counts[s]++;}
    const card=document.createElement('div'); card.className='summary-card';
    card.innerHTML=`<div class="summary-card-name">${emp.name}</div>
      <div class="summary-card-role">${emp.role||'—'}</div>
      <div class="summary-counts">
        <div class="summary-badge A"><span>${counts.A}</span>A</div>
        <div class="summary-badge B"><span>${counts.B}</span>B</div>
        <div class="summary-badge C"><span>${counts.C}</span>C</div>
        <div class="summary-badge OFF"><span>${counts.OFF}</span>OFF</div>
      </div>`;
    strip.appendChild(card);
  });
}

function renderHolidays(){
  const strip=document.getElementById('holStrip');
  const dim=new Date(currentYear,currentMonth+1,0).getDate(); const hols=[];
  for(let d=1;d<=dim;d++){const key=dk(currentYear,currentMonth+1,d);const hn=nationalHolidays[key]||customHolidays[key];if(hn)hols.push({d,name:hn,custom:!nationalHolidays[key]});}
  if(!hols.length){strip.innerHTML='';return;}
  strip.innerHTML='<span class="hol-strip-lbl">Libur</span>';
  hols.forEach(h=>{
    const chip=document.createElement('div'); chip.className='hol-chip'+(h.custom?' custom':'');
    chip.innerHTML=`<span class="hol-date">${String(h.d).padStart(2,'0')} ${MN[currentMonth].slice(0,3)}</span><span class="hol-name">${h.name}</span>`;
    strip.appendChild(chip);
  });
}

// ── Omset ──
async function loadOmsetData(){
  if(!shiftLoaded)return;
  document.getElementById('omsetContent').style.display='none';
  document.getElementById('omsetErr').style.display='none';
  document.getElementById('omsetSkelWrap').style.display='block';
  document.getElementById('omsetPanel').style.display='block';
  try{
    const res=await fetch(`${OMSET_URL}?action=omset&year=${currentYear}&month=${currentMonth+1}`);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const json=await res.json(); if(json.error)throw new Error(json.error);
    omsetData={}; (json.daily||[]).forEach(d=>{omsetData[d.date]=d;});
    document.getElementById('omsetSkelWrap').style.display='none';
    if(!json.found){document.getElementById('omsetErr').style.display='block';document.getElementById('omsetErr').innerHTML=`Sheet <strong>${MN[currentMonth]} ${currentYear}</strong> belum ditemukan.`;renderTable();return;}
    renderOmsetPanel(json); renderTable(); document.getElementById('targetInput').value=json.totalTarget||'';
  }catch(e){
    document.getElementById('omsetSkelWrap').style.display='none';
    document.getElementById('omsetErr').style.display='block';
    document.getElementById('omsetErr').innerHTML=`Gagal memuat omset. <button onclick="loadOmsetData()" style="margin-top:8px;padding:6px 14px;background:var(--ink);color:var(--bg);border:none;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:600;font-size:.8rem;">Coba Lagi</button>`;
  }
}
function renderOmsetPanel(json){
  const real=json.totalRealisasi||0,tgt=json.totalTarget||0,dim=new Date(currentYear,currentMonth+1,0).getDate();
  let passed=0,total=0;
  for(let d=1;d<=dim;d++){if(isWork(currentYear,currentMonth,d)){total++;if(d<=today.getDate()&&currentMonth===today.getMonth()&&currentYear===today.getFullYear())passed++;else if(currentMonth<today.getMonth()||currentYear<today.getFullYear())passed++;}}
  const avg=passed>0?(real/passed).toFixed(1):0,proj=total>0?Math.round(parseFloat(avg)*total):0,pct=tgt>0?Math.min(Math.round((real/tgt)*100),999):0;
  document.getElementById('statReal').textContent=real;document.getElementById('statTgt').textContent=tgt||'—';
  document.getElementById('statAvg').textContent=avg;document.getElementById('statAvgSub').textContent=`dari ${passed} hari`;
  document.getElementById('statProj').textContent=total>0?proj:'—';
  const cls=pct>=100?'g':pct>=70?'w':'r';
  document.getElementById('progPct').textContent=tgt>0?`${pct}%`:'—';document.getElementById('progPct').className=`prog-pct ${cls}`;
  document.getElementById('progBar').style.width=tgt>0?`${Math.min(pct,100)}%`:'0%';document.getElementById('progBar').className=`prog-fill ${cls}`;
  const sisa=tgt-real,sisaHari=total-passed;
  document.getElementById('progDetail').textContent=tgt>0?(sisa>0?`Butuh ${sisa} lagi · Sisa ${sisaHari} hari kerja`:`Target tercapai! Surplus ${Math.abs(sisa)}`):'Set target bulanan.';
  const nb=document.getElementById('dailyNeedBody'); nb.innerHTML='';
  if(tgt<=0)nb.innerHTML='<span style="font-size:.78rem;color:var(--ink3);">Set target untuk melihat kebutuhan.</span>';
  else if(real>=tgt)nb.innerHTML='<span style="font-weight:700;color:var(--A);">Target sudah tercapai!</span>';
  else if(sisaHari<=0)nb.innerHTML='<span style="color:var(--OFF);font-weight:600;">Tidak ada hari kerja tersisa.</span>';
  else{
    const ph=Math.ceil((tgt-real)/sisaHari),phd=((tgt-real)/sisaHari).toFixed(1);
    const clr=ph<=4?'var(--A)':ph<=6?'var(--HOL)':'var(--OFF)';
    nb.innerHTML=`<div style="display:flex;align-items:baseline;gap:4px;"><span style="font-size:1.7rem;font-weight:500;font-family:var(--mono);color:${clr};">${ph}</span><span style="font-size:.75rem;color:var(--ink3);font-weight:600;">transaksi/hari</span></div><div style="width:1px;height:30px;background:var(--border);flex-shrink:0;"></div><div style="font-size:.72rem;color:var(--ink3);line-height:1.7;">Sisa <strong style="color:var(--ink);">${tgt-real}</strong> dalam <strong style="color:var(--ink);">${sisaHari}</strong> hari<br>Persis: <strong style="color:var(--ink);">${phd}/hari</strong> · Sejauh ini: <strong style="color:var(--ink);">${avg}/hari</strong></div>`;
  }
  document.getElementById('omsetContent').style.display='block';
}
async function saveTarget(){
  const tgt=parseInt(document.getElementById('targetInput').value);
  if(isNaN(tgt)||tgt<0){toast('Target tidak valid','warning');return;}
  const btn=document.getElementById('btnTarget');btn.disabled=true;btn.textContent='…';
  try{
    await fetch(OMSET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'updateTarget',year:currentYear,month:currentMonth+1,target:tgt})});
